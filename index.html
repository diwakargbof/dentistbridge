<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe8" />
  <meta name="description" content="Chairside — Between the chair and the bench. Case-by-case workflow tracking and conversation for dental labs and dentists." />
  <title>Chairside</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />

  <!-- Design tokens -->
  <link rel="stylesheet" href="tokens.css" />

  <!-- Supabase JS (v2, UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- App config — generated by scripts/build.js from env vars.
       Falls back gracefully: app runs in demo mode without it. -->
  <script>
    // Default config — overwritten by build-generated config.js when deployed.
    window.CHAIRSIDE_CONFIG = window.CHAIRSIDE_CONFIG || {
      supabaseUrl: '',
      supabaseAnonKey: '',
      profileAEmail: '',
      profileAPassword: '',
      profileBEmail: '',
      profileBPassword: '',
    };
  </script>
  <script src="config.js" onerror="console.info('[chairside] config.js not found — running in demo mode.')"></script>

  <!-- React 18 (production builds — no SRI: hashes differ per CDN copy) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <!-- Babel standalone — transpiles JSX at runtime.
       Acceptable for this app size; migrate to a Vite build when scaling. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- 1. Supabase client + auth + real-time hooks (must be before data.jsx) -->
  <script type="text/babel" src="supabase.jsx"></script>

  <!-- 2. Mock data + Supabase-aware data layer -->
  <script type="text/babel" src="data.jsx"></script>

  <!-- 3. Shared UI primitives -->
  <script type="text/babel" src="ui.jsx"></script>

  <!-- 4. Screen components -->
  <script type="text/babel" src="screens-onboard.jsx"></script>
  <script type="text/babel" src="screens-tech.jsx"></script>
  <script type="text/babel" src="screens-dentist.jsx"></script>
  <script type="text/babel" src="screens-chat.jsx"></script>

  <!-- 5. Desktop layout (shown on wide viewports instead of phone shell) -->
  <script type="text/babel" src="desktop.jsx"></script>

  <!-- 6. App router (no iOS frame; renders in full viewport) -->
  <script type="text/babel" src="phone.jsx"></script>

  <!-- 7. Root app — auth gate + mounts Phone or Desktop layout -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
